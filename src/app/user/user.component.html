@if (!user() && !errorMessage()) {
  <app-loader></app-loader>
}
@if (!user() && errorMessage() !== '') {
  <app-error-message [message]="errorMessage()"></app-error-message>
}

@if (user(); as profile) {
  <div class="profile">
    <div class="mobile item-header">
      <p class="title-block">
        <span class="back-button" role="button" tabindex="0" (click)="goBack()" (keydown.enter)="goBack()"></span>
        Profile: {{ profile.id }}
      </p>
    </div>
    <div class="main-details">
      <span class="name">{{ profile.id }}</span>
      <span class="right">{{ profile.karma }} ★</span>
      <p class="age">Created {{ profile.created }}</p>
    </div>
    @if (profile.about) {
      <div class="other-details">
        <p [innerHTML]="profile.about"></p>
      </div>
    }
  </div>
}
