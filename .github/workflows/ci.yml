name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # tslint reports pre-existing violations across the app; run it for
      # visibility without failing the build until they are cleaned up.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm run test:ci -- --browsers=ChromeHeadlessNoSandbox

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/**/lcov.info
