name: Black Duck Security Scan + Devin Remediation

on:
  # Run on pushes to main branch
  push:
    branches: [master]
  # Run on PRs (scan only, no Devin session creation)
  pull_request:
    branches: [master]
  # Weekly scheduled scan to catch newly disclosed CVEs
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6:00 UTC
  # Allow manual trigger with options
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - log vulnerabilities without creating Devin sessions'
        required: false
        default: 'false'
        type: boolean
      min_severity:
        description: 'Minimum severity to trigger Devin remediation'
        required: false
        default: 'HIGH'
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
      mock_mode:
        description: 'Use mock Black Duck data (for testing without Black Duck credentials)'
        required: false
        default: 'false'
        type: boolean

env:
  MIN_SEVERITY: ${{ github.event.inputs.min_severity || 'HIGH' }}
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  MOCK_MODE: ${{ github.event.inputs.mock_mode || 'false' }}

jobs:
  blackduck-scan:
    name: Black Duck SCA Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '12'

      - name: Install dependencies
        run: npm ci

      # ── Black Duck Scan ──────────────────────────────────────────────
      # Uses Synopsys Detect in RAPID mode for fast policy-check scanning.
      # RAPID mode doesn't require a full persistent scan — it returns
      # vulnerability data as JSON without creating a project in Black Duck.
      - name: Run Black Duck Rapid Scan
        if: env.MOCK_MODE != 'true'
        uses: synopsys-sig/detect-action@v0.3.5
        with:
          blackduck-url: ${{ secrets.BLACKDUCK_URL }}
          blackduck-token: ${{ secrets.BLACKDUCK_API_TOKEN }}
          detect-version: latest
          scan-mode: RAPID
        continue-on-error: true # Don't fail the workflow; we handle results below

      # ── Mock Mode ────────────────────────────────────────────────────
      # Generates realistic mock vulnerability data for testing the
      # Devin API integration without needing Black Duck credentials.
      - name: Generate mock vulnerability data
        if: env.MOCK_MODE == 'true'
        run: bash .github/scripts/generate-mock-data.sh

      # ── Parse & Remediate ────────────────────────────────────────────
      - name: Parse results and create Devin sessions
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MIN_SEVERITY: ${{ env.MIN_SEVERITY }}
          DRY_RUN: ${{ env.DRY_RUN }}
        run: bash .github/scripts/parse-and-remediate.sh

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackduck-results
          path: |
            .github/scripts/blackduck-results.json
            .github/scripts/devin-sessions.log
          retention-days: 30

  # PR-only job: just report findings as a PR comment, never create Devin sessions
  pr-report:
    name: PR Security Report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: blackduck-scan
    steps:
      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          name: blackduck-results

      - name: Comment on PR with findings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results;
            try {
              results = JSON.parse(fs.readFileSync('blackduck-results.json', 'utf8'));
            } catch (e) {
              console.log('No results file found');
              return;
            }

            if (!results.vulnerabilities || results.vulnerabilities.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '## 🔒 Black Duck Security Scan\n\nNo vulnerabilities found. ✅'
              });
              return;
            }

            const critical = results.vulnerabilities.filter(v => v.severity === 'CRITICAL');
            const high = results.vulnerabilities.filter(v => v.severity === 'HIGH');
            const medium = results.vulnerabilities.filter(v => v.severity === 'MEDIUM');
            const low = results.vulnerabilities.filter(v => v.severity === 'LOW');

            let body = '## 🔒 Black Duck Security Scan Results\n\n';
            body += `| Severity | Count |\n|----------|-------|\n`;
            body += `| Critical | ${critical.length} |\n`;
            body += `| High | ${high.length} |\n`;
            body += `| Medium | ${medium.length} |\n`;
            body += `| Low | ${low.length} |\n\n`;

            if (critical.length + high.length > 0) {
              body += '### Findings requiring attention\n\n';
              [...critical, ...high].forEach(v => {
                body += `- **${v.severity}**: \`${v.component}\` — ${v.cve} (${v.description})\n`;
                if (v.fix_version) body += `  - Fix: upgrade to \`${v.fix_version}\`\n`;
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
